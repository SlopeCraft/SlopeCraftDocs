name: Build MkDocs and Deploy to GitHub Pages
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        # Use these Python versions
        python: [
          3.14.10,     # Current latest Python
        ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Show Python version
        run: python --version
      - uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify the active MkDocs implementation
        # mkdocs-static-i18n 会把上游 mkdocs 作为依赖装上，靠 mkdocs_ng.pth 的重定向
        # import mkdocs 才指向 mkdocs_ng/mkdocs。这条断言防止哪天上游那份反客为主。
        run: |
          python -c "import mkdocs, sys; print('mkdocs:', mkdocs.__version__, mkdocs.__file__); assert 'mkdocs_ng' in mkdocs.__file__, '上游 mkdocs 抢走了 import: ' + mkdocs.__file__"
      - name: Build
        # 用 python -m 而不是裸 mkdocs 命令：两个发行版都会写 Scripts/mkdocs.exe，
        # 而 -m 走的是 import 解析，由 mkdocs_ng.pth 保证拿到 ng 的实现。
        run: |
          python -m mkdocs build
      - name: Check both locales were built
        run: |
          test -d site/en || { echo "缺少 site/en：i18n 插件没有产出英文站"; exit 1; }
      - name: Deploy to GitHub Pages
        run: |
          python -m mkdocs gh-deploy --force
