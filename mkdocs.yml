site_name: SlopeCraft 文档
docs_dir: 'docs'
repo_url: https://github.com/SlopeCraft/SlopeCraftDocs
repo_name: SlopeCraft/SlopeCraftDocs
edit_uri: edit/main/docs/

site_author: SlopeCraft Team, Qubik65536, ToKiNoBug and Contributors
copyright: Copyright © 2023 SlopeCraft Team, Qubik65536, ToKiNoBug and Contributors. 
  All rights reserved.<br/>
  Licensed under <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.en">Creative Commons Attribution-NonCommercial 4.0 International License</a>.

theme:
  name: material
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.tabs
    - content.tooltips
    - search.suggest
  favicon: 'assets/favicon.ico'
  logo: 'assets/logo.png'

# Customization
extra_css:
  - '_static/css/extra.css?v=14'

# 语言切换器
# 触发原因见 plugins.i18n.languages 里的注释：插件探测不到主题版本，就不会自动生成
# extra.alternate。这里手动补上，Material 会自己渲染顶栏的语言下拉。
# link 必须是站点根的绝对路径。当前行为与迁移前一致（迁移前 site_url 未设，base_url 也是空）；
# 若站点实际挂在子路径下（gh-pages 项目页 /SlopeCraftDocs/、RTD 的 /{lang}/{version}/），
# 这两条需要配合 site_url 一起校准。
extra:
  alternate:
    - name: 中文
      link: /
      lang: zh
    - name: English
      link: /en/
      lang: en
  
# Extensions
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true 
  - pymdownx.arithmatex:
      generic: true
  - tables
  - footnotes
  - pymdownx.tilde
  - attr_list
  - md_in_html

# Navigation
nav:
  - 欢迎使用 SlopeCraft: index.md
  - 原理简介: principles-introduction.md
  - SlopeCraft 教程: SlopeCraft-tutorial.md
  - VisualCraft 教程: VisualCraft-tutorial.md
  - 常见问题: faq.md
  - 编译指南:
    - 通用: compilation-guide/index.md
    - Windows/Linux: compilation-guide/Windows-Linux.md
    - macOS: compilation-guide/macOS.md

# Plugins
plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: zh
          name: 中文
          default: true
          site_name: SlopeCraft 文档
          build: true
          # 必须显式指定界面语言。mkdocs-static-i18n 1.3.1 靠 version("mkdocs-material")
          # 探测主题版本，而我们装的是 mkdocs-ng-material，探测失败后会整段跳过
          # reconfigure_material_theme，其中就包括设置 theme.language。
          # 少了这两行，中文站的界面文案（搜索框、目录标题等）会退回英文。
          theme:
            language: zh
        - locale: en
          name: English
          site_name: SlopeCraft Documentation
          build: true
          theme:
            language: en
          nav_translations:
            欢迎使用 SlopeCraft: Welcome to SlopeCraft
            原理简介: Introduction of Principles
            SlopeCraft 教程: SlopeCraft Tutorial
            VisualCraft 教程: VisualCraft Tutorial
            常见问题: FAQ
            编译指南: Compilation Guide
            通用: General
            Windows/Linux: Windows/Linux
            macOS: macOS

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
